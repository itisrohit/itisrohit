<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Floating elements -->
  <text x="100" y="150" font-family="monospace" font-size="24" fill="#3b82f6" opacity="0.3">&lt;/&gt;</text>
  <text x="1000" y="200" font-family="monospace" font-size="20" fill="#06b6d4" opacity="0.3">const</text>
  <text x="150" y="500" font-family="monospace" font-size="18" fill="#3b82f6" opacity="0.3">fn</text>
  <text x="1050" y="450" font-family="monospace" font-size="22" fill="#06b6d4" opacity="0.3">=&gt;</text>
  
  <!-- Main content -->
  <g transform="translate(100, 200)">
    <!-- Badge -->
    <rect x="0" y="0" width="200" height="40" rx="20" fill="#3b82f6" opacity="0.1" stroke="#3b82f6" stroke-width="1"/>
    <text x="20" y="25" font-family="monospace" font-size="14" fill="#3b82f6">backend-first.dev</text>
    
    <!-- Title -->
    <text x="0" y="100" font-family="system-ui, sans-serif" font-size="64" font-weight="bold" fill="white">
      Backend-First
    </text>
    <text x="0" y="160" font-family="system-ui, sans-serif" font-size="64" font-weight="bold" fill="url(#text)">
      Developer
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="220" font-family="system-ui, sans-serif" font-size="24" fill="#9ca3af">
      Systems Engineer & API Architect
    </text>
    
    <!-- Tech stack -->
    <text x="0" y="280" font-family="monospace" font-size="16" fill="#6b7280">
      TypeScript • Node.js • Docker • Kubernetes • MongoDB • PostgreSQL
    </text>
  </g>
  
  <!-- Terminal window -->
  <g transform="translate(700, 150)">
    <rect x="0" y="0" width="400" height="300" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    
    <!-- Terminal header -->
    <rect x="0" y="0" width="400" height="40" rx="12" fill="#374151"/>
    <circle cx="20" cy="20" r="6" fill="#ef4444"/>
    <circle cx="40" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="60" cy="20" r="6" fill="#10b981"/>
    
    <!-- Terminal content -->
    <text x="20" y="70" font-family="monospace" font-size="14" fill="#3b82f6">$ whoami</text>
    <text x="20" y="95" font-family="monospace" font-size="14" fill="#9ca3af">backend-systems-engineer</text>
    <text x="20" y="125" font-family="monospace" font-size="14" fill="#3b82f6">$ system status</text>
    <text x="20" y="150" font-family="monospace" font-size="14" fill="#10b981">✓ All services operational</text>
    <text x="20" y="175" font-family="monospace" font-size="14" fill="#10b981">✓ 99.9% uptime maintained</text>
    <text x="20" y="200" font-family="monospace" font-size="14" fill="#10b981">✓ Performance optimized</text>
    <text x="20" y="230" font-family="monospace" font-size="14" fill="#3b82f6">$ echo "Ready to build 🚀"</text>
    <text x="20" y="255" font-family="monospace" font-size="14" fill="#10b981">Ready to build 🚀</text>
  </g>
  
  <!-- Bottom tagline -->
  <text x="100" y="580" font-family="monospace" font-size="16" fill="#6b7280">
    Crafted with precision • Designed to inspire • Built for impact
  </text>
</svg> 